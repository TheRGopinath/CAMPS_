[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-camps-demo"
version = "0.1.0"
description = "Explainable stabilizer, MPS and OFD-CAMPS dissertation demonstration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.5"]

[tool.setuptools]
packages = ["stabilizers_pbc", "mps", "camps"]
